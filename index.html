<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="description" content="מערכת ניהול בניה" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var s = location.pathname.split("/").filter(Boolean)[0];
          var icon = s ? localStorage.getItem("bt_icon_" + s) : null;
          var name = (s ? localStorage.getItem("bt_name_" + s) : null) || "פסגת הגלעד";
          document.write('<meta name="apple-mobile-web-app-title" content="' + name.replace(/"/g, "") + '" />');
          document.write('<link rel="apple-touch-icon" sizes="180x180" href="' + (icon || "/apple-touch-icon.png") + '" />');
          document.write("<title>" + name.replace(/</g, "") + "</title>");
          // קובץ התקנה לכל קבלן — השם והלוגו שלו, ונפתח ישר לדף שלו (התקנה במחשב ובטלפון)
          if (s) {
            var o = location.origin;
            var ic = icon ? (/^(https?:|data:)/.test(icon) ? icon : o + icon) : null;
            var m = {
              name: name, short_name: name.length > 12 ? name.slice(0, 12) : name,
              description: "מערכת ניהול בנייה",
              id: "/" + s, start_url: o + "/" + s, scope: o + "/",
              display: "standalone", background_color: "#F5F5F0", theme_color: "#1A1A2E",
              lang: "he", dir: "rtl",
              icons: ic ? [{ src: ic, sizes: "512x512", type: "image/png", purpose: "any" }]
                        : [{ src: o + "/apple-touch-icon.png", sizes: "512x512", type: "image/png", purpose: "any" },
                           { src: o + "/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" }]
            };
            document.write('<link rel="manifest" href="data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)).replace(/'/g, "%27") + '" />');
          } else {
            document.write('<link rel="manifest" href="/manifest.json" />');
          }
        } catch (e) {
          document.write('<meta name="apple-mobile-web-app-title" content="פסגת הגלעד" />');
          document.write('<link rel="apple-touch-icon" href="/apple-touch-icon.png" />');
          document.write("<title>פסגת הגלעד</title>");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
