<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="description" content="מערכת ניהול בניה" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var s = location.pathname.split("/").filter(Boolean)[0];
          var icon = s ? localStorage.getItem("bt_icon_" + s) : null;
          var name = (s ? localStorage.getItem("bt_name_" + s) : null) || "פסגת הגלעד";
          document.write('<meta name="apple-mobile-web-app-title" content="' + name.replace(/"/g, "") + '" />');
          document.write('<link rel="apple-touch-icon" sizes="180x180" href="' + (icon || "/apple-touch-icon.png") + '" />');
          document.write("<title>" + name.replace(/</g, "") + "</title>");
          // קובץ התקנה לכל קבלן — השם והלוגו שלו, ונפתח ישר לדף שלו (התקנה במחשב ובטלפון)
          if (s) {
            var o = location.origin;
            var ic = icon ? (/^(https?:|data:)/.test(icon) ? icon : o + icon) : null;
            var m = {
              name: name, short_name: name.length > 12 ? name.slice(0, 12) : name,
              description: "מערכת ניהול בנייה",
              id: "/" + s, start_url: o + "/" + s, scope: o + "/",
              display: "standalone", background_color: "#F5F5F0", theme_color: "#1A1A2E",
              lang: "he", dir: "rtl",
              icons: ic ? [{ src: ic, sizes: "512x512", type: "image/png", purpose: "any" }]
                        : [{ src: o + "/apple-touch-icon.png", sizes: "512x512", type: "image/png", purpose: "any" },
                           { src: o + "/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" }]
            };
            document.write('<link rel="manifest" href="data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)).replace(/'/g, "%27") + '" />');
          } else {
            document.write('<link rel="manifest" href="/manifest.json" />');
          }
        } catch (e) {
          document.write('<meta name="apple-mobile-web-app-title" content="פסגת הגלעד" />');
          document.write('<link rel="apple-touch-icon" href="/apple-touch-icon.png" />');
          document.write("<title>פסגת הגלעד</title>");
        }
      })();
    </script>
  </head>
  <body style="margin:0;background:#1A1A2E">
    <!-- מסך טעינה: אם האפליקציה לא עולה — רואים "טוען" (ולא דף לבן), ואחרי זמן מה כפתור לתיקון -->
    <div id="root"><div id="bt-boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Heebo,Arial,sans-serif;color:#E8C547;direction:rtl;text-align:center;padding:24px;box-sizing:border-box">
      <div style="font-size:18px;font-weight:700">טוען...</div>
      <div id="bt-boot-msg" style="color:#ccc;font-size:13px;margin-top:14px;max-width:320px"></div>
    </div></div>
    <script>
      // אם יש שגיאה לפני שהאפליקציה עלתה, או שהטעינה נתקעת — מציגים הודעה וכפתור תיקון במקום דף ריק
      (function () {
        function fixBtn() {
          return '<div style="margin-top:16px"><button onclick="btHardReload()" style="background:#E8C547;color:#1A1A2E;border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700">🔄 נקה ורענן</button></div>';
        }
        window.btHardReload = function () {
          var done = function () { location.reload(); };
          try {
            var ps = [];
            if (window.caches && caches.keys) ps.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) ps.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
            Promise.all(ps).then(done, done);
            setTimeout(done, 3000);
          } catch (e) { done(); }
        };
        function show(msg) {
          var el = document.getElementById("bt-boot-msg");
          if (el) el.innerHTML = msg + fixBtn();
        }
        window.addEventListener("error", function (e) {
          if (document.getElementById("bt-boot")) show("שגיאה בטעינה: " + String((e && (e.message || (e.target && e.target.src))) || "").slice(0, 160));
        }, true);
        setTimeout(function () {
          if (document.getElementById("bt-boot")) show("הטעינה לוקחת יותר מדי זמן. בדוק את החיבור לאינטרנט, או לחץ:");
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
